name: CI

on:
  push:
    branches: [main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for branch/PR refs; let tag builds always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Minimal permissions by default; individual jobs add only what they need.
permissions:
  contents: read

env:
  IMAGE: 1121citrus/mokerlink-backup

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────────────────
  lint:
    uses: 1121citrus/shared-github-workflows/.github/workflows/lint.yml@v1

  # ── Stage 2: Build ─────────────────────────────────────────────────────────
  build:
    needs: lint
    uses: 1121citrus/shared-github-workflows/.github/workflows/build.yml@v1
    with:
      image: 1121citrus/mokerlink-backup

  # ── Stage 3: Test ──────────────────────────────────────────────────────────
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/image.tar.gz | docker load

      - name: Run test suite
        # Run inside the same bats/bats:1.13.0 Alpine container used locally so
        # test behaviour is identical in CI and on developer machines.  The
        # Docker socket is mounted so tests can invoke docker commands, and
        # IMAGE is set to the locally-loaded :latest tag.
        run: |
          docker run --rm -i \
            -v "$PWD:$PWD" \
            -v /tmp:/tmp \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e "IMAGE=$IMAGE:latest" \
            --workdir "$PWD" \
            --entrypoint sh \
            bats/bats:1.13.0 \
            -c "apk add --quiet --no-cache docker-cli >/dev/null 2>&1 && bats test"

  # ── Stage 4: Security scan ─────────────────────────────────────────────────
  scan:
    needs: build
    uses: 1121citrus/shared-github-workflows/.github/workflows/scan.yml@v1
    with:
      image: 1121citrus/mokerlink-backup

  # ── Stage 5: Push to Docker Hub ────────────────────────────────────────────
  push:
    needs: [test, scan]
    if: >
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/staging'
      )
    uses: 1121citrus/shared-github-workflows/.github/workflows/push.yml@v1
    with:
      image: 1121citrus/mokerlink-backup
    secrets: inherit
