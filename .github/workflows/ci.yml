name: CI

on:
  push:
    branches: [dev, main, master, staging]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  ci:
    uses: 1121citrus/shared-github-workflows/.github/workflows/pipeline.yml@v1
    with:
      image: 1121citrus/mokerlink-backup
      inject-metadata: true
      test-mode: run-all-image
      test-run-all-cmd: ./test/run-all
      test-extra-packages: python3
      trivyignore: .trivyignore
      # pipeline.yml's push stage only runs on v* tags unless force-push
      # opts the branch build in too -- staging pushes a branch, not a
      # tag, so without this every staging push computes zero tags and
      # fails with "tag is needed when pushing to registry". Scoped to
      # staging only so dev/main branch pushes don't also publish.
      force-push: ${{ github.ref == 'refs/heads/staging' }}
    secrets: inherit
