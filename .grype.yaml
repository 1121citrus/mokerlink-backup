# Grype ignore rules — unfixed findings with documented mitigations.
# All entries are documented in SECURITY.md.
#
# Pruned 2026-11-24: removed every Alpine/apk-type entry (python3, busybox,
# openssh, unzip, py3-urllib3, py3-cryptography, py3-pip, wheel/jaraco-context
# pip-vendor, gnupg, lz4, openldap, py3-jmespath). The base image moved from
# Alpine to Amazon Linux 2023 in v1.0.1; none of those apk packages exist in
# the image any more, so the entries were dead weight. Replaced with the
# findings an unsuppressed `grype docker-archive:...` reports against the
# current `aws-backup-base` 1.2.3 pin, verified 2026-11-24. Grype is
# informational only (no `fail-on-severity`; see SECURITY.md), so these
# entries exist to keep the advisory report free of noise, not to pass a
# gate.
#
# All entries below require Python >= 3.10; the base image ships Python 3.9.
# See SECURITY.md "Open vulnerabilities" for the per-package detail.

ignore:
  # urllib3 (RPM python3-urllib3, reported by Grype as a python package):
  # 1.25.10 is the newest AL2023 RPM build; no AL2023 fix exists, and
  # awscli-2 pins python3.9dist(urllib3) <= 2.6.3.
  - vulnerability: GHSA-q2q7-5pp4-w6pg
    package:
      name: urllib3
      type: python

  # urllib3 (pip-installed copy): 2.6.3 is the newest release that still
  # supports Python 3.9; 2.7.0 and 2.8.0 both declare requires_python
  # ">=3.10".
  - vulnerability: GHSA-mf9v-mfxr-j63j
    package:
      name: urllib3
      type: python

  - vulnerability: GHSA-vxq7-64xx-v4gw
    package:
      name: urllib3
      type: python

  - vulnerability: GHSA-qccp-gfcp-xxvc
    package:
      name: urllib3
      type: python

  - vulnerability: GHSA-8988-9cw3-xx77
    package:
      name: urllib3
      type: python

  - vulnerability: GHSA-gh4c-6fx4-qh6g
    package:
      name: urllib3
      type: python

  # setuptools (RPM python3-setuptools 59.6.0 and the pip-installed 82.0.1
  # copy, both reported by Grype as python packages): 82.0.1 is the newest
  # release that still supports Python 3.9; 83.0.0 and 84.1.0 both declare
  # requires_python ">=3.10". The RPM has no AL2023 fix either.
  - vulnerability: GHSA-h35f-9h28-mq5c
    package:
      name: setuptools
      type: python

  - vulnerability: GHSA-xmj3-9gf7-h52w
    package:
      name: setuptools
      type: python
